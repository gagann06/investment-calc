[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-simulator"
version = "0.2.0"
description = "Historical multi-asset portfolio simulator with contribution scheduling, rebalancing and risk analytics"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["portfolio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
